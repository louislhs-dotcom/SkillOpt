_base_: ../_base_/default.yaml
env:
  data_path: ''
  limit: 0
  max_completion_tokens: 4096
  max_turns: 1
  name: gebiz
  skill_init: skillopt/envs/gebiz/skills/initial.md
  split_dir: data/gebiz_split
  split_mode: split_dir
  split_output_dir: ''
  workers: 3
evaluation:
  eval_test: false
  sel_env_num: 5
  test_env_num: 5
  use_gate: true
gradient:
  analyst_workers: 4
  failure_only: false
  merge_batch_size: 5
  minibatch_size: 5
model:
  # NIM (free tier, 5 concurrent) for both optimizer and target
  backend: openai_compatible
  optimizer: nvidia/nemotron-3-ultra-550b-a55b
  optimizer_azure_openai_auth_mode: openai_compatible
  optimizer_azure_openai_endpoint: https://integrate.api.nvidia.com/v1
  optimizer_azure_openai_api_key: $NVIDIA_NIM_API_KEY
  optimizer_backend: openai_compatible
  reasoning_effort: low
  target: nvidia/nemotron-3-ultra-550b-a55b
  target_azure_openai_auth_mode: openai_compatible
  target_azure_openai_endpoint: https://integrate.api.nvidia.com/v1
  target_azure_openai_api_key: $NVIDIA_NIM_API_KEY
  target_backend: openai_compatible
optimizer:
  learning_rate: 3
  lr_scheduler: constant
  use_meta_skill: false
  use_slow_update: false
train:
  accumulation: 1
  batch_size: 5
  num_epochs: 2
  seed: 42
  train_size: 15