_base_: ../_base_/default.yaml

# Use Switchyard for intelligent model routing
env:
  name: webintel
  skill_init: skillopt/envs/webintel/skills/initial.md
  split_dir: data/webintel_split
  split_mode: split_dir
  workers: 2
  # Switchyard config
  switchyard_config: configs/switchyard_skillopt.toml
  switchyard_optimizer_route: nemotron
  switchyard_target_route: lightning
  switchyard_gate_route: skillopt
  # Switchyard timeouts (seconds per route) - INCREASED based on telemetry
  switchyard_timeouts:
    nemotron: 600
    lightning: 120
    skillopt: 180
  switchyard_max_retries: 3
  # Pace requests to avoid NVIDIA free-tier rate limits (HTTP 429).
  # 1.5s between requests + 15s backoff on 429 keeps the run under quota.
  switchyard_request_delay: 1.5
  # Site configs for multi-site training
  skill_template: skillopt/envs/webintel/skills/initial.md
  site_config: skillopt/envs/webintel/site_configs/lazada_sg.md

evaluation:
  eval_test: false
  sel_env_num: 18
  test_env_num: 5
  use_gate: true
  use_dsh_judge: true
  # HARDENED: use the graded soft score for the validation gate. Hard
  # accuracy is coarse 0/1 per item and ties the baseline (0.556) on every
  # candidate, so a strict hard gate rejects all improvements. Soft (0.706
  # baseline) distinguishes real gains.
  gate_metric: soft
  # Judge: NVIDIA Nemotron Super (llama-3.3-nemotron-super-49b-v1.5) via
  # nvidia_judge.py. All-NVIDIA, no DSH dependency. Used as a semantic
  # tiebreaker on partial matches (0 < soft < 1). Falls back to keyword
  # scoring on any failure.
  judge_backend: nvidia-super

gradient:
  analyst_workers: 4
  failure_only: false
  merge_batch_size: 5
  minibatch_size: 5

# Model config tells trainer to use Switchyard
model:
  backend: switchyard
  optimizer: nvidia/nemotron-3-ultra-550b-a55b
  optimizer_backend: switchyard
  target: nvidia/nemotron-3.5-lightning-30b-a3b
  target_backend: switchyard
  reasoning_effort: low

optimizer:
  learning_rate: 3
  lr_scheduler: constant
  use_meta_skill: false
  use_slow_update: false
  # Hard no-growth veto (evidence: growing edits never improve the score).
  veto_growing_candidates: true

train:
  accumulation: 1
  batch_size: 5
  num_epochs: 3
  seed: 42
  train_size: 83