_base_: ../_base_/default.yaml
env:
  data_path: ''
  limit: 0
  max_completion_tokens: 4096
  max_turns: 1
  name: webintel
  skill_init: skillopt/envs/webintel/skills/initial.md
  split_dir: data/webintel_split
  split_mode: split_dir
  split_output_dir: ''
  workers: 2
  switchyard_config: configs/switchyard_skillopt.toml
  switchyard_optimizer_route: nemotron
  switchyard_target_route: lightning
  switchyard_gate_route: skillopt
  switchyard_timeouts:
    nemotron: 600
    lightning: 120
    skillopt: 180
  switchyard_max_retries: 5
  switchyard_request_delay: 3.0
  site_config: skillopt/envs/webintel/site_configs/lazada_sg.md
evaluation:
  eval_test: false
  sel_env_num: 32
  test_env_num: 5
  use_gate: true
  use_dsh_judge: true
  gate_metric: soft
  judge_backend: nvidia-super
gradient:
  analyst_workers: 8
  failure_only: false
  merge_batch_size: 5
  minibatch_size: 5
model:
  backend: switchyard
  optimizer: nvidia/nemotron-3-ultra-550b-a55b
  optimizer_backend: switchyard
  reasoning_effort: low
  target: nvidia/nemotron-3.5-lightning-30b-a3b
  target_backend: switchyard
  azure_openai_endpoint: https://integrate.api.nvidia.com/v1
  optimizer_azure_openai_endpoint: https://integrate.api.nvidia.com/v1
  target_azure_openai_endpoint: https://integrate.api.nvidia.com/v1
  azure_openai_auth_mode: openai_compatible
  optimizer_azure_openai_auth_mode: openai_compatible
  target_azure_openai_auth_mode: openai_compatible
  azure_openai_api_key: ${NVIDIA_API_KEY}
  optimizer_azure_openai_api_key: ${NVIDIA_API_KEY}
  target_azure_openai_api_key: ${NVIDIA_API_KEY}
optimizer:
  learning_rate: 3
  lr_scheduler: constant
  use_meta_skill: false
  use_slow_update: false
  # Hard no-growth veto (evidence: growing edits never improve the score).
  veto_growing_candidates: true
train:
  accumulation: 1
  batch_size: 5
  num_epochs: 2
  seed: 42
  train_size: 85
population:
  size: 4
  seeds:
  - 42
  - 123
  - 456
  - 789
  crossover_every: 5
  crossover_top_k: 2
