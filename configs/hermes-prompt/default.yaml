_base_: ../_base_/default.yaml
env:
  data_path: ''
  limit: 0
  max_completion_tokens: 1024
  max_turns: 1
  name: hermes-prompt
  skill_init: skillopt/envs/hermes_prompt/skills/initial.md
  split_dir: data/hermes-prompt
  split_mode: split_dir
  split_ratio: "6:2:2"
  split_output_dir: ''
  workers: 3
evaluation:
  eval_test: false
  gate_metric: soft
  sel_env_num: 20
  test_env_num: 21
  use_gate: true
gradient:
  analyst_workers: 4
  failure_only: false
  merge_batch_size: 4
  minibatch_size: 4
model:
  azure_openai_api_key: ${OLLAMA_API_KEY}
  azure_openai_auth_mode: openai_compatible
  azure_openai_endpoint: https://ollama.com/v1
  backend: openai_compatible
  optimizer: nvidia/nemotron-3.5-lightning-30b-a3b
  optimizer_azure_openai_api_key: ${NVIDIA_API_KEY}
  optimizer_azure_openai_auth_mode: openai_compatible
  optimizer_azure_openai_endpoint: https://integrate.api.nvidia.com/v1
  optimizer_backend: openai_compatible
  reasoning_effort: low
  extra_body:
    chat_template_kwargs:
      thinking: true
  optimizer_extra_body:
    chat_template_kwargs:
      thinking: false
  target: deepseek-v4-flash:cloud
  target_azure_openai_api_key: ${OLLAMA_API_KEY}
  target_azure_openai_auth_mode: openai_compatible
  target_azure_openai_endpoint: https://ollama.com/v1
  target_backend: openai_compatible
optimizer:
  learning_rate: 3
  lr_scheduler: constant
  use_meta_skill: false
  use_slow_update: false
train:
  accumulation: 1
  batch_size: 4
  num_epochs: 2
  seed: 42
  train_size: 61
